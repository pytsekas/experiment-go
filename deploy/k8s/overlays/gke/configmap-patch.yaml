apiVersion: v1
kind: ConfigMap
metadata:
  name: experiment-go-config
  namespace: experiment-go
data:
  # The Cloud SQL Auth Proxy sidecar listens on localhost inside the pod, so from
  # the app's point of view the database is local and unencrypted; the proxy does
  # the TLS and IAM work.
  POSTGRES_HOST: "127.0.0.1"
  POSTGRES_SSLMODE: "disable"
