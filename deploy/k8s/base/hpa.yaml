apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: experiment-go
  namespace: experiment-go
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: experiment-go
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percentage of the *request* (100m), not of a core — so 60% means
          # roughly 60m of CPU per pod before it scales out.
          averageUtilization: 60
  behavior:
    scaleUp:
      # Default is 0s + a 3-minute stabilisation on the way down; shortening the
      # scale-up window makes the reaction visible during a 5-minute load test.
      stabilizationWindowSeconds: 15
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
